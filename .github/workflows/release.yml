# Release pipeline for Wallpaper Sync
#
# Triggered manually from GitHub Actions UI:
#   1. Go to Actions → "Release" → "Run workflow"
#   2. Pick major, minor, or patch
#   3. Pipeline bumps version everywhere, builds, tests, packages MSI,
#      tags the commit, and creates a GitHub Release with artifacts attached.
#
# Secrets required:  NONE  (uses built-in GITHUB_TOKEN)

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Bump, Build & Release
    runs-on: windows-latest

    steps:
      # ── Setup ──

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history for release notes

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # ── Version bump ──

      - name: Calculate new version
        id: version
        shell: pwsh
        run: |
          # Read current version from TrayApp csproj (source of truth)
          [xml]$csproj = Get-Content "src/WallpaperApp.TrayApp/WallpaperApp.TrayApp.csproj"
          $current = (Select-Xml -Xml $csproj -XPath "//Version").Node.InnerText
          Write-Host "Current version: $current"

          $parts = $current.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = [int]$parts[2]

          switch ("${{ inputs.bump }}") {
            "major" { $major++; $minor = 0; $patch = 0 }
            "minor" { $minor++; $patch = 0 }
            "patch" { $patch++ }
          }

          $new = "$major.$minor.$patch"
          Write-Host "New version: $new"
          "NEW_VERSION=$new" >> $env:GITHUB_OUTPUT
          "TAG=v$new" >> $env:GITHUB_OUTPUT

      - name: Update version in TrayApp csproj
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.NEW_VERSION }}"
          $file = "src/WallpaperApp.TrayApp/WallpaperApp.TrayApp.csproj"
          $content = Get-Content $file -Raw

          # Update <Version>, <AssemblyVersion>, <FileVersion>
          $content = $content -replace '<Version>[^<]+</Version>', "<Version>$v</Version>"
          $content = $content -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$v.0</AssemblyVersion>"
          $content = $content -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$v.0</FileVersion>"

          Set-Content $file $content -NoNewline
          Write-Host "Updated $file to $v"

      - name: Update version in WiX installer
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.NEW_VERSION }}"
          $file = "installer/Package.wxs"
          $content = Get-Content $file -Raw

          # Update Version="x.y.z.0" in the Package element (WiX v4 requires 4-part version)
          $content = $content -replace '(Version=")[^"]+(")', "`${1}$v.0`${2}"

          Set-Content $file $content -NoNewline
          Write-Host "Updated $file to $v"

      - name: Update version in MSIX identity manifest
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.NEW_VERSION }}"
          $file = "installer/IdentityPackage/AppxManifest.xml"
          $content = Get-Content $file -Raw

          # Update Version="x.y.z.0" in the Identity element (MSIX requires 4-part version)
          $content = $content -replace '(Version=")[^"]+(")', "`${1}$v.0`${2}"

          Set-Content $file $content -NoNewline
          Write-Host "Updated $file to $v.0"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/WallpaperApp.TrayApp/WallpaperApp.TrayApp.csproj installer/Package.wxs installer/IdentityPackage/AppxManifest.xml
          git commit -m "Bump version to ${{ steps.version.outputs.NEW_VERSION }}"

      # ── Build + Test ──

      - name: Restore dependencies
        run: dotnet restore WallpaperApp.sln

      - name: Build solution
        run: dotnet build WallpaperApp.sln -c Release --no-restore --warnaserror --verbosity minimal --nologo

      - name: Run tests
        run: dotnet test src/WallpaperApp.Tests/WallpaperApp.Tests.csproj -c Release --no-build --verbosity minimal --nologo

      # ── Publish ──

      - name: Publish Console App
        run: dotnet publish src/WallpaperApp/WallpaperApp.csproj -c Release -o publish/WallpaperApp --no-build --verbosity minimal --nologo

      - name: Publish Tray App (single-file, self-contained)
        run: >
          dotnet publish src/WallpaperApp.TrayApp/WallpaperApp.TrayApp.csproj
          -c Release -o bin/TrayApp
          --self-contained true --runtime win-x64
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          --verbosity minimal --nologo

      # ── Package MSI ──

      - name: Restore WiX toolset
        run: dotnet tool restore

      - name: Add WiX UI extension
        run: dotnet tool run wix extension add WixToolset.UI.wixext/4.0.5
        continue-on-error: true

      - name: Build MSI installer
        run: >
          dotnet tool run wix build installer/Package.wxs
          -ext WixToolset.UI.wixext
          -o installer/WallpaperSync-Setup.msi
          -arch x64

      # ── Tag + Push ──

      - name: Tag and push
        run: |
          git tag ${{ steps.version.outputs.TAG }}
          git push origin HEAD:main --tags

      # ── Create Release ──

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Wallpaper Sync ${{ steps.version.outputs.TAG }}
          generate_release_notes: true
          files: |
            installer/WallpaperSync-Setup.msi
            bin/TrayApp/WallpaperApp.TrayApp.exe
